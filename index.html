<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タラモアのサイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --brown: #5c4033;
    --light-brown: #a08070;
    --dark: #2a1f1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream);
    color: var(--dark);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.4rem 2.5rem;
    border-bottom: 1px solid #ddd6c8;
    background: var(--cream);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .nav-logo {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.1rem;
    letter-spacing: 0.15em;
    color: var(--brown);
    text-decoration: none;
  }
  .nav-links {
    display: flex;
    gap: 2.2rem;
    list-style: none;
  }
  .nav-links a {
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    color: var(--light-brown);
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--brown); }
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 5rem 2rem 4rem;
    text-align: center;
  }
  .avatar-wrap {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--light-brown);
    box-shadow: 0 8px 32px rgba(92,64,51,0.15);
    margin-bottom: 2rem;
  }
  .avatar-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
  }
  h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: 2.2rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: var(--brown);
    margin-bottom: 0.8rem;
  }
  .tagline {
    font-size: 0.9rem;
    color: var(--light-brown);
    letter-spacing: 0.1em;
    line-height: 1.8;
    max-width: 400px;
  }
  .divider {
    width: 40px;
    height: 1px;
    background: var(--light-brown);
    margin: 2.5rem auto;
    opacity: 0.5;
  }
  .cards {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    padding: 0 2rem 5rem;
    flex-wrap: wrap;
  }
  .card {
    background: white;
    border: 1px solid #e0d8ce;
    border-radius: 2px;
    padding: 2rem 2.5rem;
    width: 200px;
    text-align: center;
    text-decoration: none;
    color: var(--dark);
    transition: box-shadow 0.25s, transform 0.25s;
  }
  .card:hover {
    box-shadow: 0 6px 24px rgba(92,64,51,0.12);
    transform: translateY(-3px);
  }
  .card-icon { font-size: 1.8rem; margin-bottom: 0.7rem; display: block; }
  .card-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 1rem;
    letter-spacing: 0.12em;
    color: var(--brown);
    margin-bottom: 0.4rem;
  }
  .card-desc { font-size: 0.75rem; color: var(--light-brown); letter-spacing: 0.05em; }
  footer {
    border-top: 1px solid #ddd6c8;
    padding: 2rem;
    text-align: center;
    font-size: 0.8rem;
    color: var(--light-brown);
    letter-spacing: 0.08em;
  }
  footer a { color: var(--light-brown); text-decoration: none; }
  footer a:hover { color: var(--brown); text-decoration: underline; }
</style>
</head>
